syntax = "proto3";
package rpc.metadata;
option go_package = "QuickStone/src/rpc/metadata";

message RegisterUploadingObjectRequest {
    string target_user_name = 1;
    string bucket = 2;
    string key = 3;
    string upload_timestamp = 4;
}

message RegisterUploadingObjectResponse {
    uint32 status_code = 1;
    string status_msg = 2;
}

message DeleteObjectRequest {
    string target_user_name = 1;
    string bucket = 2;
    string key = 3;
}

message DeleteObjectResponse {
    uint32 status_code = 1;
    string status_msg = 2;
}

message GetObjectMetaRequest {
    string target_user_name = 1;
    string bucket = 2;
    string key = 3;
}

message GetObjectMetaResponse {
    
}

service MetadataService {
    rpc RegisterUploadingObject(RegisterUploadingObjectRequest) returns(RegisterUploadingObjectResponse);
    rpc DeleteObject(DeleteObjectRequest) returns(DeleteObjectResponse);
}