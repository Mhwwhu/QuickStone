syntax = "proto3";
package rpc.plugin_dispatcher;
option go_package = "QuickStone/src/rpc/plugin_dispatcher";

message TriggerOnUploadRequest {
    string target_user_name = 1;
    string bucket_name = 2;
    string key = 3;
    uint64 size = 4;
    string object_type = 5;
    string create_time = 6;
}

